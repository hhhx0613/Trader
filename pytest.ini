[pytest]
# pytest 9 在此 Windows 环境可能遗留不可访问的 pytest-cache-files-* 目录；跨会话缓存不是必需的。
# pytest 9 may leave inaccessible pytest-cache-files-* directories on this Windows environment; cross-session caching is non-essential.
# 所有每次运行的临时 fixture 都固定在 tmp/pytest，避免散落到项目根目录。
# All per-run fixture files are kept under tmp/pytest to avoid cluttering the repository root.
addopts = -p no:cacheprovider --basetemp tmp/pytest
